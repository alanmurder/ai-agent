apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-secrets
  namespace: ai-agent
  labels:
    app: ai-agent
type: Opaque
stringData:
  # Database credentials
  DATABASE_URL: "postgresql://aiagent:password@postgres:5432/aiagent"
  POSTGRES_USER: "aiagent"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Model API keys
  DEEPSEEK_API_KEY: "CHANGE_ME"
  ZHIPU_API_KEY: "CHANGE_ME"
  QWEN_API_KEY: "CHANGE_ME"
  BAIDU_API_KEY: "CHANGE_ME"
  OPENAI_API_KEY: "CHANGE_ME"
  ANTHROPIC_API_KEY: "CHANGE_ME"

  # Redis password (if needed)
  REDIS_PASSWORD: ""

  # JWT secret
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_RANDOM_STRING"

  # Encryption key for sensitive data
  ENCRYPTION_KEY: "CHANGE_ME_32_BYTES_RANDOM_STRING"

---
# PostgreSQL secret for the postgres instance
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ai-agent
type: Opaque
stringData:
  POSTGRES_USER: "aiagent"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_DB: "aiagent"

---
# Redis secret (if Redis requires authentication)
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: ai-agent
type: Opaque
stringData:
  REDIS_PASSWORD: ""